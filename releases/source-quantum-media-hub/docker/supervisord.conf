[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.log
autorestart=true
user=root

[program:backend]
command=python -m uvicorn backend.main:app --host 0.0.0.0 --port 8001 --workers 4
directory=/app
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend.log
autorestart=true
user=app
environment=PYTHONPATH="/app/backend",MONGO_URL="%(ENV_MONGO_URL)s",DB_NAME="%(ENV_DB_NAME)s"

[program:video-processor]
command=python -c "
import asyncio
import sys
sys.path.append('/app/backend')
from services.video_service import VideoProcessingService
async def main():
    service = VideoProcessingService()
    await service.start_processing_worker()
    while True:
        await asyncio.sleep(1)
asyncio.run(main())
"
directory=/app
stdout_logfile=/var/log/supervisor/video-processor.log
stderr_logfile=/var/log/supervisor/video-processor.log
autorestart=true
user=app

[program:analytics-worker]
command=python -c "
import asyncio
import sys
sys.path.append('/app/backend')
from services.analytics_service import AdvancedAnalyticsService
async def main():
    while True:
        await asyncio.sleep(10)
        print('Analytics worker running...')
asyncio.run(main())
"
directory=/app
stdout_logfile=/var/log/supervisor/analytics.log
stderr_logfile=/var/log/supervisor/analytics.log
autorestart=true
user=app

[inet_http_server]
port=127.0.0.1:9001

[supervisorctl]
serverurl=http://127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface